name: Distribute Android
on:
  workflow_call:
    secrets:
      FIREBASE_ADMIN_SDK:
        required: true
      SHOREBIRD_TOKEN:
        required: false
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name }}
    concurrency:
      group: distribute-android-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/core/free-disk-space@prod
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/android/setup-android-shorebird@prod
        with:
          shorebird_token: ${{ secrets.SHOREBIRD_TOKEN }}
      - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/cache-flutter-android@prod
      - id: get-build-version
        uses: HishamKoptaN/ci_cd_pipeline/.github/actions/core/get-build-version@prod
        with:
          platform: "android"
          shorebird_token: ${{ secrets.SHOREBIRD_TOKEN }}
      - run: |
            shorebird release android \
            --target=lib/main.dart \
            --artifact=apk \
            --flutter-version=3.50.0 \
            --flavor=${{ github.ref_name }} \
            --dart-define=ENV=${{ github.ref_name }} \
            --build-name=${{ steps.get-build-version.outputs.build_name }} \
            --build-number=${{ steps.get-build-version.outputs.build_number }} \
            --target-platform=android-arm64 \
            -- \
            --no-tree-shake-icons
      - id: get_app_id
        run: |
          DART_FILE="lib/config/firebase/${{ github.ref_name }}/firebase_options.dart"
          if [ -f "$DART_FILE" ]; then
            APP_ID=$(sed -n '/static const FirebaseOptions android/,/);/p' "$DART_FILE" | grep "appId:" | sed "s/.*'\([^']*\)'.*/\1/")
            if [ -n "$APP_ID" ]; then
              echo "Found Firebase App ID: $APP_ID"
              echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "❌ Could not find Firebase App ID for ${{ github.ref_name }}"
          exit 1
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.get_app_id.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_ADMIN_SDK }}
          groups: "apk"
          file: build/app/outputs/flutter-apk/app-${{ github.ref_name }}-release.apk
      - name: Disk usage after distribute
        if: always()
        run: |
          echo "== Disk after distribute =="
          df -h /
          du -sh build .dart_tool ~/.gradle /usr/local/lib/android/sdk 2>/dev/null || true
      - name: Clean Gradle caches
        if: always()
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper/dists build android/.gradle .dart_tool/build || true
          df -h /
