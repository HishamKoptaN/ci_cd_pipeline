name: Distribute Android
on:
  workflow_call:
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name }}
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v6 
        with:
          fetch-depth: 0
      - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/android/setup-android-shorebird@prod
        with:
          shorebird_token: ${{ secrets.SHOREBIRD_TOKEN }}
      - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/cache-flutter-android@prod
      - id: get-build-version
        uses: HishamKoptaN/ci_cd_pipeline/.github/actions/core/get-build-version@prod
        with:
          platform: "android"
          shorebird_token: ${{ secrets.SHOREBIRD_TOKEN }}
      - shell: bash 
        env:
         GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.caching=true -Dorg.gradle.vfs.watch=true"
         SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
            shorebird android \
            --target=lib/main.dart \
            --artifact=apk \
            --flutter-version=3.47.7 \
            --flavor=${{ github.ref_name }} \
            --dart-define=ENV=${{ github.ref_name }} \
            --build-name=${{ steps.get-build-version.outputs.build_name }} \
            --build-number=${{ steps.get-build-version.outputs.build_number }} \
            --target-platform=android-arm64 \
            -- \
            --no-tree-shake-icons
      - id: get_app_id
        run: |
          DART_FILE="lib/config/firebase/${{ github.ref_name }}/firebase_options.dart"
          if [ -f "$DART_FILE" ]; then
            APP_ID=$(sed -n '/static const FirebaseOptions android/,/);/p' "$DART_FILE" | grep "appId:" | sed "s/.*'\([^']*\)'.*/\1/")
            if [ -n "$APP_ID" ]; then
              echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "app_id=" >> $GITHUB_OUTPUT
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.get_app_id.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_ADMIN_SDK }}
          groups: all
          file: build/app/outputs/flutter-apk/app-${{ github.ref_name }}-release.apk
        continue-on-error: true
