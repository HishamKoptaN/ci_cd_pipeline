name: Auto PR
on:
  workflow_call:
  push:
    branches-ignore:
      - 'prod'
      - 'dev'
permissions:
  contents: write
  pull-requests: write
jobs:
  pull-request:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Skip notice — missing secrets
        if: env.GITHUB_TOKEN == ''
        run: echo "::notice title=Skipped Auto PR::GITHUB_TOKEN is empty; protected steps were skipped"
      - uses: actions/checkout@v7
      - if: env.GITHUB_TOKEN != ''
        uses: diillson/auto-pull-request@v1.0.1
        with:
          source_branch: ""
          destination_branch: "dev"
          pr_title: "Automated PR from ${{ github.ref }}"   
          pr_body: |
            :crown: *An automated PR created by AI Agent / GitHub Actions*
            This pull request was automatically generated for branch `${{ github.ref }}`.
          github_token: ${{ secrets.GITHUB_TOKEN }}