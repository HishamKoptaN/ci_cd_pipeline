name: Lint GitHub Actions

# Validates workflow syntax, expressions, action references and shell scripts
# before they can fail at startup. Runs on every PR that touches Actions config.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
  push:
    branches: [dev, prod]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
