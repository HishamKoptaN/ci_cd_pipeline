name: 00-main
env:
  force_javascript_actions_to_node24: true
  actions_allow_use_unsecure_node_version: true
permissions:
  contents: write
on:
  workflow_call:
  push:
    branches: [dev, prod]
  workflow_dispatch:
jobs: 
  prod_pipeline:
    if: github.ref_name == 'prod'
    uses: ./.github/workflows/20-shorebird-layer.yml
    secrets: inherit

  dev_pipeline:
    if: github.ref_name == 'dev'
    uses: ./.github/workflows/50-distribution-layer.yml
    secrets: inherit
