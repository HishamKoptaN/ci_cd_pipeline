name: 00-main
env:
  force_javascript_actions_to_node24: true
  actions_allow_use_unsecure_node_version: true
permissions:
  contents: write
  checks: write
  pull-requests: write
on:
  workflow_call:
  push:
    branches: [dev, prod]
  workflow_dispatch:
jobs: 
  auto_pr:
    if: github.ref_name != 'dev' && github.ref_name != 'prod'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/auto-pr.yml
    secrets: inherit
  web_pipeline:
    permissions:
      contents: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/50-firebase-hosting.yml
    secrets: inherit
  prod_pipeline:
    if: github.ref_name == 'prod'
    uses: ./.github/workflows/20-shorebird-layer.yml
    secrets: inherit
  dev_pipeline:
    if: github.ref_name == 'dev'
    uses: ./.github/workflows/50-distribution-layer.yml
    secrets: inherit
