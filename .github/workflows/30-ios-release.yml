name: 30-shorebird-ios-release.yml
on:
  workflow_call:
    inputs:
      flavor:
        required: false
        type: string
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ inputs.flavor || github.ref_name }}
    env:
      FLAVOR: ${{ inputs.flavor || github.ref_name }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
    steps:
      - name: Skip notice — missing secrets or vars
        if: >-
          env.SHOREBIRD_TOKEN == '' || env.APP_STORE_CONNECT_API_PRIVATE_KEY == '' ||
          env.APP_STORE_CONNECT_ISSUER_ID == '' || env.APP_STORE_CONNECT_API_KEY_ID == ''
        run: echo "::notice title=Skipped iOS release::A required secret or variable is empty; protected steps were skipped"
      - uses: actions/checkout@v7
      - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/core/setup-flutter@prod
      - if: env.SHOREBIRD_TOKEN != ''
        uses: HishamKoptaN/ci_cd_pipeline/.github/actions/core/setup-shorebird@prod
      - if: >-
          env.APP_STORE_CONNECT_API_PRIVATE_KEY != '' && env.APP_STORE_CONNECT_ISSUER_ID != '' &&
          env.APP_STORE_CONNECT_API_KEY_ID != ''
        uses: HishamKoptaN/ci_cd_pipeline/.github/actions/ios/setup-ios-signing@prod
        with:
          appstore_issuer_id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          appstore_api_key_id: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          appstore_api_private_key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/swift-package-manager
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-pods-swift-${{ hashFiles('ios/Podfile.lock') }}
      - uses: actions/cache@v6
        with:
          path: |
            build/
            .dart_tool/
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile.lock') }}
      - run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ios/SourcePackages
          rm -rf ~/Library/Caches/com.apple.dt.Xcode           
      - run: flutter pub get
        shell: bash
      - run: |
          cd ios
          pod install
        shell: bash
      - if: env.SHOREBIRD_TOKEN != ''
        run: |
              shorebird release ios \
              --flutter-version=3.50.0 \
              --flavor=${{ env.FLAVOR }} \
              --dart-define=ENV=${{ env.FLAVOR }} \
              --target=lib/main.dart \
              --export-options-plist=ios/ExportOptions.plist
      - id: find_ipa
        run: |
            IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
            echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
      - run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          echo "FOUND_IPA=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IPA File: $IPA_PATH"
      - if: >-
          env.SHOREBIRD_TOKEN != '' && env.APP_STORE_CONNECT_API_PRIVATE_KEY != '' &&
          env.APP_STORE_CONNECT_ISSUER_ID != '' && env.APP_STORE_CONNECT_API_KEY_ID != ''
        uses: apple-actions/upload-testflight-build@v5
        with:
           app-path: ${{ env.FOUND_IPA }}
           issuer-id: ${{ env.APP_STORE_CONNECT_ISSUER_ID }}
           api-key-id: ${{ env.APP_STORE_CONNECT_API_KEY_ID }}
           api-private-key: ${{ env.APP_STORE_CONNECT_API_PRIVATE_KEY }}
           backend: altool
           app-type: ios
           