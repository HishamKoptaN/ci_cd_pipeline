name: 20-shorebird-ios-patch.yml

on:
  workflow_call:
jobs:
  patch:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ github.ref_name }}
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
    steps:
      - name: Skip notice — missing secrets or vars
        if: >-
          env.SHOREBIRD_TOKEN == '' || env.APP_STORE_CONNECT_ISSUER_ID == '' ||
          env.APP_STORE_CONNECT_API_KEY_ID == '' || env.APP_STORE_CONNECT_API_PRIVATE_KEY == ''
        run: echo "::notice title=Skipped iOS patch::A required secret or variable is empty; protected steps were skipped"
      - uses: actions/checkout@v7
      - uses: ./.github/actions/core/setup-flutter
      - if: env.SHOREBIRD_TOKEN != ''
        uses: ./.github/actions/core/setup-shorebird
      - if: >-
          env.APP_STORE_CONNECT_ISSUER_ID != '' && env.APP_STORE_CONNECT_API_KEY_ID != '' &&
          env.APP_STORE_CONNECT_API_PRIVATE_KEY != ''
        uses: ./.github/actions/ios/setup-ios-signing
        with:
          appstore_issuer_id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          appstore_api_key_id: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          appstore_api_private_key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      - uses: ./.github/actions/core/setup-flutter
      - uses: actions/cache@v6
        with:
          path: |
            build/
            ios/Pods
            ios/.symlinks
          key: ios-patch-${{ github.sha }}-macos
          restore-keys: ios-patch-macos-
      - run: flutter pub get
      - run: |
          cd ios
          pod install --repo-update
      - if: env.SHOREBIRD_TOKEN != ''
        run: |
          shorebird patch ios \
          --export-options-plist=ios/ExportOptions.plist \
          --flavor="${{ github.ref_name }}" \
          --release-version=latest \
          --dart-define=ENV=${{ github.ref_name }} \
