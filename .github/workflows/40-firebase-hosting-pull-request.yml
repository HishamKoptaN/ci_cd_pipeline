name: Firebase Hosting - Preview on PR

on:
  workflow_call:
    inputs:
      flutter-version:
        description: Flutter version used to build the web app.
        type: string
        required: false
        default: "3.50.0"
      project-id:
        description: Firebase project id. Falls back to the caller's PROJECT_ID variable.
        type: string
        required: false
        default: ""
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        description: Firebase service account JSON from the caller repository or environment.
        required: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate Firebase config
        env:
          FIREBASE_PROJECT_ID: ${{ inputs.project-id || vars.PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Set PROJECT_ID in the caller repository or pass project-id."
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Pass FIREBASE_SERVICE_ACCOUNT from the caller."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
      - run: flutter build web --release --dart-define=ENV=${{ github.base_ref == 'prod' && 'prod' || 'dev' }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ inputs.project-id || vars.PROJECT_ID }}
