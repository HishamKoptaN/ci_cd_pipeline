name: Deploy Android Shorebird

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      full_version:
        type: string
        required: true
      base_version:
        type: string
        required: true
    outputs:
      changed:
        value: ${{ jobs.deploy.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      changed: ${{ steps.deploy.outputs.changed }}
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Skip notice — missing secrets
        if: env.SHOREBIRD_TOKEN == ''
        run: echo "::notice title=Skipped Shorebird deployment::SHOREBIRD_TOKEN is empty; protected steps were skipped"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - id: deploy
        if: env.SHOREBIRD_TOKEN != ''
        shell: bash
        run: |
          version="${{ inputs.full_version }}"
          baseVersion="${{ inputs.base_version }}"
          flavor="${{ inputs.flavor }}"
          TARGET_ID="e962126d-ee7a-48f2-b89d-fb0349f4a05f"
          if [ "$flavor" = "prod" ]; then
            TARGET_ID="ed427ccb-5edb-4594-a376-2ee9636bef4e"
          fi
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          androidReleaseVersion="$version"
          if [ "$flavor" != "prod" ]; then
            androidReleaseVersion="${version/+/-$flavor+}"
          fi
          versionChanged=false
          if shorebird patch android --flavor=$flavor --build-name="$baseVersion" --release-version="$androidReleaseVersion" --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | tee /tmp/patch_output; then
            :
          else
            if grep -qi "Release not found\|No release exists\|UnpatchableChangeException\|asset changes\|native changes" /tmp/patch_output; then
              if shorebird release android --flavor=$flavor --build-name="$baseVersion" --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | tee /tmp/release_output; then
                versionChanged=true
              else
                if grep -q "existing.*release\|already exists" /tmp/release_output; then
                  versionChanged=false
                else
                  exit 1
                fi
              fi
            else
              exit 1
            fi
          fi
          echo "changed=$versionChanged" >> "$GITHUB_OUTPUT"
      - if: env.SHOREBIRD_TOKEN != '' && inputs.flavor == 'prod' && hashFiles('build/app/outputs/bundle/*/*.aab') != ''
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-${{ inputs.flavor }}
          path: build/app/outputs/bundle/*/*.aab
          retention-days: 1
      - if: env.SHOREBIRD_TOKEN != '' && (steps.deploy.outputs.changed == 'true' || inputs.flavor == 'dev')
        run: |
          shorebird release android --flavor=${{ inputs.flavor }} --artifact=apk --dart-define=ENV=${{ inputs.flavor }} '--' --no-tree-shake-icons || true
          ls -la build/app/outputs/flutter-apk/
      - if: env.SHOREBIRD_TOKEN != '' && (steps.deploy.outputs.changed == 'true' || inputs.flavor == 'dev')
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ inputs.flavor }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1
