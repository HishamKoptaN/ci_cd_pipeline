name: 30-android-release.yml
on:
  workflow_call:
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref_name }}
    concurrency:
      group: android-release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/core/free-disk-space@prod
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/android/setup-android-shorebird@prod
      - id: get-build-version
        uses: HishamKoptaN/ci_cd_pipeline/.github/actions/core/get-build-version@prod
        with:
          platform: "android"
      - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/cache-flutter-android@prod
      - id: run
        run: |
          flavor="${{ github.ref_name }}"
          shorebird release android \
          --flavor=$flavor \
          --build-name=${{ steps.get-build-version.outputs.build_name }} \
          --build-number=${{ steps.get-build-version.outputs.build_number }} \
          --dart-define=ENV=$flavor \
          --artifact=apk \
          --target-platform=android-arm64 \
          -- \
          --no-tree-shake-icons
      - run: |
          echo "{
            \"versionCode\": ${{ steps.get-build-version.outputs.build_number }},
            \"versionName\": \"${{ steps.get-build-version.outputs.build_name }}\"
          }" > version.json
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ github.ref_name }}
          path: build/app/outputs/**/*.apk
          retention-days: 1
      - name: Disk usage after release
        if: always()
        run: |
          echo "== Disk after release =="
          df -h /
          du -sh build .dart_tool ~/.gradle /usr/local/lib/android/sdk 2>/dev/null || true
      - name: Clean Gradle caches
        if: always()
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper/dists build android/.gradle .dart_tool/build || true
          df -h /

