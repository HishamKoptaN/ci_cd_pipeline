name: setup-shorebird
description: setup-shorebird
inputs:
  shorebird_token:
    description: "Shorebird API token"
    required: false
runs:
  using: "composite"
  steps:
    - uses: shorebirdtech/setup-shorebird@v1
      with:
        shorebird-token: ${{ inputs.shorebird_token || env.SHOREBIRD_TOKEN }}
        cache: true