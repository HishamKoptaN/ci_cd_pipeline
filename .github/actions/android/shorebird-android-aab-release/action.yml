name: shorebird-android-aab-release
description: shorebird-android-aab-release
inputs:
  google_play_service_account_json:
    required: true
  track:
    type: string
    required: true
  package_name:
    type: string
    required: true
  build_name:
    required: false
  build_number:
    required: false
runs:
  using: "composite"
  steps:
      - id: get-build-version
        uses: HishamKoptaN/ci_cd_pipeline/.github/actions/core/get-build-version@prod
        with:
          platform: "android"
          build_name: ${{ inputs.build_name }}
          build_number: ${{ inputs.build_number }}
      - shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.caching=true -Dorg.gradle.vfs.watch=true"
        run: |
            shorebird release android \
            --flutter-version=3.50.0 \
            --flavor=${{ github.ref_name }} \
            --dart-define=ENV=${{ github.ref_name }} \
            --build-name=${{ steps.get-build-version.outputs.build_name }} \
            --build-number=${{ steps.get-build-version.outputs.build_number }}
      - id: upload-play
        uses: r0adkll/upload-google-play@v1
        with:
          packageName: ${{ inputs.package_name }}
          serviceAccountJsonPlainText: ${{ inputs.google_play_service_account_json }}
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          tracks: ${{ inputs.track }}
          status: completed
          changesNotSentForReview: false
          inAppUpdatePriority: 5
      
  




