name: setup-ios-shorebird
description: setup-ios-shorebird
inputs:
  p12_password:
    required: false
    default: ""
  shorebird_token:
    required: true 
runs:
  using: "composite"
  steps:
    - uses: HishamKoptaN/ci_cd_pipeline/.github/actions/core/setup-shorebird@prod
      with:
        shorebird_token: ${{ inputs.shorebird_token }}
    - run: flutter pub get
      shell: bash
    - run: |
        cd ios
        pod install
      shell: bash