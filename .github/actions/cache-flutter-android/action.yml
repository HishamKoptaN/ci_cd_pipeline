name: 'Cache Flutter & Android Build'
description: 'Caches Flutter, Dart, Gradle, and Android Native build artifacts for faster CI builds'

runs:
  using: "composite"
  steps:
    - name: Check runner disk space
      shell: bash
      run: |
        echo "=== Disk space ==="
        df -h /
        echo "=== Inodes ==="
        df -i /
        echo "=== Largest directories ==="
        sudo du -xhd1 / 2>/dev/null | sort -hr | head -20 || true
    - name: Free runner disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
    - uses: actions/cache@v4
      with:
        path: |
          .pub-cache/
        key: flutter-deps-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: |
          flutter-deps-${{ runner.os }}-
    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android/.gradle
          android/app/.cxx
        key: ${{ runner.os }}-gradle-native-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'android/app/build.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-gradle-native-
